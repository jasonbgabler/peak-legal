<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEΛK — Legal &amp; Support</title>
<style>
  :root {
    --bg: #F7F5FB; --surface: #FFFFFF; --ink: #231A38; --sub: #6E6486;
    --accent: #7C3AED; --line: #E7E1F2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    line-height: 1.65;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 48px 24px 80px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 40px 36px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  p { margin: 0 0 12px; font-size: 15px; color: var(--sub); }
  ul { padding-left: 0; list-style: none; margin: 24px 0 0; }
  li { margin: 0 0 12px; }
  a { color: var(--accent); font-size: 16px; font-weight: 600; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .brand { display: flex; align-items: baseline; gap: 10px; margin-bottom: 24px; }
  .brand .logo { font-weight: 800; font-size: 22px; letter-spacing: -0.5px; }
  .brand .tag { color: var(--sub); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="brand"><span class="logo">PEΛK</span><span class="tag">Meals · Activity · Mood</span></div>
    <h1>Legal &amp; Support</h1>
    <p>PEΛK is a personal wellness and self-tracking app for iPhone.</p>
    <ul>
      <li><a href="./privacy-policy.html">Privacy Policy</a></li>
      <li><a href="./terms.html">Terms of Service</a></li>
      <li><a href="./support.html">Support</a></li>
    </ul>
  </div>
</div>
</body>
</html>
