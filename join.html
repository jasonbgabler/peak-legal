<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join on PEAK</title>
  <meta name="robots" content="noindex" />
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #141021; color: #F4F1FA; }
    main { max-width: 440px; margin: 0 auto; padding: 56px 24px; text-align: center; }
    h1 { font-size: 26px; margin: 0 0 8px; }
    p { color: #B8AFCF; line-height: 1.5; margin: 0 0 20px; }
    .code { font-size: 30px; letter-spacing: 6px; font-weight: 800; color: #B79CF8; margin: 8px 0 24px; }
    a.btn { display: inline-block; background: #4A7BDB; color: #fff; text-decoration: none; font-weight: 600; padding: 14px 28px; border-radius: 14px; }
    small { display: block; margin-top: 28px; color: #8E85A8; }
  </style>
</head>
<body>
  <main>
    <h1>You're invited to PEAK</h1>
    <p>Someone wants to connect with you in PEAK — as a partner, a coach or in a community.</p>
    <div class="code" id="code"></div>
    <a class="btn" id="open" href="#">Open in PEAK</a>
    <p style="margin-top:24px">Don't have the app yet? Install PEAK, then go to <b>Connect › Share</b>, tap <b>Have a code?</b> and enter the code above.</p>
    <small>Nothing is shared until you choose what to share in the app.</small>
  </main>
  <script>
    (function () {
      var code = (new URLSearchParams(location.search).get("code") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12);
      document.getElementById("code").textContent = code || "—";
      var url = "peak://join/" + encodeURIComponent(code);
      document.getElementById("open").setAttribute("href", url);
      if (code) setTimeout(function () { location.href = url; }, 300);
    })();
  </script>
</body>
</html>
